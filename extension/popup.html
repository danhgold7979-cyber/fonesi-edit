<!doctype html><html lang="vi"><meta charset="utf-8"><title>Fonesi Chrome bridge</title>
<style>body{font:14px system-ui;width:330px;padding:14px;background:#151c2c;color:#eef}input,select,button{box-sizing:border-box;width:100%;padding:9px;margin:6px 0}p{white-space:pre-wrap}</style>
<h3>Fonesi — Chrome thật</h3><p>Ghép đúng hồ sơ bằng mã lấy từ Cài đặt Fonesi. Chỉ gửi phiên khi bạn bấm nút bên dưới.</p>
<input id="code" placeholder="Mã ghép hồ sơ (hết hạn sau 5 phút)"><button id="pair">Ghép hồ sơ</button>
<select id="platform"><option>YouTube</option><option>Facebook</option><option>TikTok</option><option>Instagram</option><option>Threads</option><option>X</option><option>Bilibili</option><option>Douyin</option><option>Xiaohongshu</option><option>Kuaishou</option></select>
<button id="send">Gửi phiên nền tảng đã chọn cho Fonesi</button><label><input type="checkbox" id="auto" style="width:auto"> Tự đồng bộ phiên nền tảng này khi cookie đổi</label><p id="status">Chưa kiểm tra.</p><script src="popup.js"></script></html>
