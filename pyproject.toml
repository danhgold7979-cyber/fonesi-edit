[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "fonesi-edit"
version = "0.1.0.dev1"
requires-python = ">=3.12,<3.14"
description = "Clean rebuild of Fonesi Edit; foundation under verification"
dependencies = [
    "pyside6==6.8.3",
]

[project.scripts]
fonesi-edit = "fonesi_edit.launch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fonesi_edit"]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "ruff>=0.17.3",
]
