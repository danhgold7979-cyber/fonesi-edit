[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fonesi-edit"
version = "0.1.0.dev1"
description = "Spec-first Fonesi Edit desktop rebuild"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6==6.8.3",
  "pysubs2==1.9.0",
  "psutil==7.2.2",
  "fonttools==4.67.0",
  "Pillow==11.3.0",
  "yt-dlp[default]==2026.10.26",
  "gallery-dl==1.32.18",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3"]

[project.scripts]
fonesi-edit = "fonesi_edit.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fonesi_edit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
