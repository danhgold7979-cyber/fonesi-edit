[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "fonesi-edit"
version = "0.0.1"
description = "Phase 2 technical prototype for the Fonesi Edit desktop application"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6==6.8.3",
  "yt-dlp>=2025.1.1",
  "gallery-dl>=1.28,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
fonesi-prototype = "fonesi_edit.prototypes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fonesi_edit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
