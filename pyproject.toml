[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "fonesi-edit"
version = "0.0.1"
description = "Personal desktop media downloader, subtitle editor, batch compositor and scene matrix"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6==6.8.3",
  "yt-dlp[default]>=2025.1.1",
  "gallery-dl>=1.28,<2",
  "pysubs2>=1.7,<2",
  "psutil>=6,<8",
  "fonttools>=4.50,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
fonesi-prototype = "fonesi_edit.prototypes.cli:main"
fonesi-edit = "fonesi_edit.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fonesi_edit"]

[tool.hatch.build.targets.wheel.force-include]
"extension" = "fonesi_edit/resources/extension"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
