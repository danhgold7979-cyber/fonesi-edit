name: Apply P04 Slice AR

on:
  push:
    branches: [develop/fonesi-full]
    paths:
      - '.github/patches/p04-slice-ar.b64.*'
      - '.github/workflows/apply-p04-slice-ar.yml'

permissions:
  contents: write

concurrency:
  group: apply-p04-slice-ar
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'danhgold7979-cyber'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact integration HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct and validate reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/p04-slice-ar.b64.* | base64 --decode > "$RUNNER_TEMP/p04-slice-ar.patch"
          echo "7f2b12f9a0f733f03913386b0a372e7fb9d611a6a9ce108928f87fb37ad1779a  $RUNNER_TEMP/p04-slice-ar.patch" | sha256sum --check --strict -
          git apply --check "$RUNNER_TEMP/p04-slice-ar.patch"
          git apply "$RUNNER_TEMP/p04-slice-ar.patch"
          git diff --check
          python -m compileall -q src tests scripts

      - name: Commit reviewed implementation and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/patches/p04-slice-ar.b64.* .github/workflows/apply-p04-slice-ar.yml
          git add docs/phases/P04_PLAN.md \
            src/fonesi_edit/storage/timeline_edit_commands.py \
            src/fonesi_edit/ui/timeline.py \
            tests/test_timeline_edit_commands.py \
            tests/test_timeline_panel_controls.py
          git config user.name 'danhgold7979-cyber'
          git config user.email 'danhgold7979@gmail.com'
          git commit -m 'feat(P04-05): add draggable exact-frame timeline markers'
          git push origin HEAD:develop/fonesi-full
