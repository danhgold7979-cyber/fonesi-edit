name: Diagnose P04 marker drag

on:
  push:
    branches: [develop/fonesi-full]
    paths: ['.github/workflows/diagnose-p04-marker-drag.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --locked --python 3.12
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libgl1
      - name: Print exact marker event routing
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import os, tempfile
          from fractions import Fraction
          from pathlib import Path
          from PySide6.QtCore import QPoint, QPointF, Qt
          from PySide6.QtTest import QTest
          from PySide6.QtWidgets import QApplication
          from fonesi_edit.storage.project_creation import NewProjectIntent, empty_project
          from fonesi_edit.storage.projects import ProjectStore, save_project_file
          from fonesi_edit.ui.shell import MainWindow

          app=QApplication.instance() or QApplication([])
          root=Path(tempfile.mkdtemp(prefix='marker-diag-'))
          path=root/'project.json'
          save_project_file(path,empty_project(NewProjectIntent('Marker diagnostic',1920,1080,Fraction(30),Fraction(10))))
          store=ProjectStore(root/'store.db')
          window=MainWindow(store);window.show();app.processEvents()
          window.open_project(path);window.navigation.setCurrentRow(3)
          timeline=window.timeline_panel;timeline.parentWidget().setCurrentIndex(1);app.processEvents()
          timeline.playhead_slider.setValue(12);timeline.add_timeline_marker();app.processEvents()
          marker_id=timeline.selected_marker_id
          item=next(value for value in timeline.scene.items() if getattr(value,'marker_id',None)==marker_id)
          start_scene=item.mapToScene(QPointF(0,90))
          target_scene=QPointF(timeline._scene_x_for_frame(75),start_scene.y())
          start=timeline.view.mapFromScene(start_scene);end=timeline.view.mapFromScene(target_scene)
          print('WINDOW',window.size().width(),window.size().height(),window.isVisible())
          print('TIMELINE',timeline.size().width(),timeline.size().height(),timeline.isVisible())
          print('VIEW',timeline.view.size().width(),timeline.view.size().height(),timeline.view.isVisible())
          print('VIEWPORT',timeline.view.viewport().rect(),timeline.view.viewport().isVisible())
          print('SCENE_RECT',timeline.scene.sceneRect(),'TRANSFORM',timeline.view.transform().m11(),timeline.view.transform().m22())
          print('ITEM_RECT',item.rect(),'POS',item.pos(),'BOUND',item.sceneBoundingRect())
          print('START_SCENE',start_scene,'START_VIEW',start,'CONTAINS',timeline.view.viewport().rect().contains(start))
          print('END_SCENE',target_scene,'END_VIEW',end,'CONTAINS',timeline.view.viewport().rect().contains(end))
          print('ITEM_FLAGS',int(item.flags().value),'BUTTONS',int(item.acceptedMouseButtons().value),'ENABLED',item.isEnabled(),'VISIBLE',item.isVisible())
          print('ITEMS_AT_START',[(type(x).__name__,x.zValue(),int(x.acceptedMouseButtons().value)) for x in timeline.scene.items(start_scene)])
          print('ITEM_AT_TRANSFORM',type(timeline.scene.itemAt(start_scene,timeline.view.transform())).__name__ if timeline.scene.itemAt(start_scene,timeline.view.transform()) else None)
          before=window.session.revision
          QTest.mousePress(timeline.view.viewport(),Qt.MouseButton.LeftButton,pos=QPoint(start));app.processEvents()
          grab=timeline.scene.mouseGrabberItem()
          print('AFTER_PRESS','grab',type(grab).__name__ if grab else None,'selected',item.isSelected(),'focus',item.hasFocus(),'origin',item._drag_origin,'pos',item.pos())
          QTest.mouseMove(timeline.view.viewport(),QPoint(end));app.processEvents()
          print('AFTER_MOVE','grab',type(timeline.scene.mouseGrabberItem()).__name__ if timeline.scene.mouseGrabberItem() else None,'pos',item.pos(),'revision',window.session.revision)
          QTest.mouseRelease(timeline.view.viewport(),Qt.MouseButton.LeftButton,pos=QPoint(end));app.processEvents()
          for _ in range(20):app.processEvents()
          print('AFTER_RELEASE','pos',item.pos(),'revision',window.session.revision,'before',before,'message',timeline.action_message.text())
          window.close();app.processEvents();store.close()
          PY
      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/diagnose-p04-marker-drag.yml
          git config user.name 'danhgold7979-cyber'
          git config user.email 'danhgold7979@gmail.com'
          git commit -m 'chore(ci): remove P04 marker drag diagnostic'
          git push origin HEAD:develop/fonesi-full
