name: Desktop verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-proof:
    name: Desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
      - name: Linux media prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libegl1 libopengl0
      - name: Windows media prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --version=7.1.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed' }
      - name: Install exact locked dependencies
        run: uv sync --locked
      - name: Check phase references
        run: uv run python scripts/check_plan.py
      - name: Local regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q --junitxml=desktop-tests.xml
      - name: Build production desktop and native host
        run: uv run python scripts/build_desktop.py --native-host
      - name: Exercise packaged application and workers
        run: uv run python scripts/verify_packaged.py --folder .local/packaged-ci
      - name: Upload synthetic proof only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-evidence-${{ runner.os }}
          retention-days: 3
          include-hidden-files: true
          path: |
            desktop-tests.xml
            .local/packaged-ci/proof.json
            .local/packaged-ci/frame-*.png
            .local/packaged-ci/desktop.png
            dist/FonesiEdit/build-info.json
            dist/FonesiEdit/ffmpeg-build.txt
      - name: Keep Windows development build for review
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FonesiEdit-Windows-development
          retention-days: 7
          path: dist/FonesiEdit/
