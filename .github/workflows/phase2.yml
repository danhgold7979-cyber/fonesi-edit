name: Phase 2 technical verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-media-proof:
    name: P02 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
      - name: Linux media prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libegl1 libopengl0
      - name: Windows media prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --version=7.1.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed' }
          ffmpeg -version
      - name: Install exact locked dependencies
        run: uv sync --locked
      - name: Check phase references
        run: uv run python scripts/check_plan.py
      - name: Meaningful local checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q --junitxml=p02-tests.xml
      - name: Render fresh synthetic evidence
        run: uv run python scripts/run_p02_local.py
      - name: Build Windows proof
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Run packaged Windows UI proof
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $video = Get-ChildItem .local -Recurse -Filter result.mp4 | Select-Object -First 1
          if (-not $video) { throw 'Missing generated media proof' }
          $image = Join-Path $PWD '.local/p02-packaged-ui.png'
          $args = @('--smoke', '--source', $video.FullName, '--screenshot', $image)
          $process = Start-Process -FilePath 'dist/FonesiP02/FonesiP02.exe' -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Packaged proof timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged proof exit $($process.ExitCode)" }
          if (-not (Test-Path $image)) { throw 'Packaged proof did not produce a screenshot' }
      - name: Test evidence only; never browser profiles or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p02-evidence-${{ runner.os }}
          retention-days: 3
          include-hidden-files: true
          path: |
            p02-tests.xml
            .local/p02-*/evidence.json
            .local/p02-*/*/frame.png
            .local/p02-packaged-ui.png
