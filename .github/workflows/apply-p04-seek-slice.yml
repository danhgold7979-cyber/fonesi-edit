name: Apply P04 exact preview seek

on:
  push:
    branches: [develop/fonesi-full]
    paths:
      - '.github/scripts/apply_p04_seek_slice.py'
      - '.github/workflows/apply-p04-seek-slice.yml'

permissions:
  contents: write

concurrency:
  group: apply-p04-exact-preview-seek
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'danhgold7979-cyber'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact integration HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reproduce locked environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.13.4
          uv sync --locked --python 3.12
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libgl1

      - name: Apply guarded seek slice and run affected regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/scripts/apply_p04_seek_slice.py)" = "2092de54cfaac96baedc841caf70ca554e2d2a2a"
          uv run --no-sync python .github/scripts/apply_p04_seek_slice.py
          git diff --check
          python scripts/check_plan.py
          uv run --no-sync python -m compileall -q src tests scripts .github/scripts
          uv run --no-sync python -m pytest -q \
            tests/test_preview_seek.py \
            tests/test_timeline_preview_ui.py \
            tests/test_media_preview.py

      - name: Commit reviewed product diff and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/apply_p04_seek_slice.py \
            .github/workflows/apply-p04-seek-slice.yml
          git add src/fonesi_edit/media/seek.py \
            src/fonesi_edit/ui/timeline.py \
            tests/test_preview_seek.py
          git config user.name 'danhgold7979-cyber'
          git config user.email 'danhgold7979@gmail.com'
          git commit -m 'feat(P04-06): add exact rational preview seek plan'
          git push origin HEAD:develop/fonesi-full
