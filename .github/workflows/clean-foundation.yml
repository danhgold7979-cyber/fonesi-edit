name: Clean foundation (not product acceptance)
on:
  push:
    branches: [phase-03]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    # Separate explicit native-tool checkpoint reuses unchanged aggregate evidence.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[windows-ffmpeg]') }}
    strategy:
      fail-fast: false
      # Explicit diagnostic commits preserve prior green matrix evidence; not aggregate acceptance.
      matrix: ${{ fromJSON(github.event_name == 'push' && (contains(github.event.head_commit.message, '[coordinator-diagnostic]') || contains(github.event.head_commit.message, '[windows-boundary]') || contains(github.event.head_commit.message, '[admission-observation]') || contains(github.event.head_commit.message, '[windows-cleanup]')) && '{"include":[{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.13"}]}' || '{"os":["windows-latest","ubuntu-24.04"],"python":["3.12","3.13"]}') }}
    name: "${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[coordinator-diagnostic]') && 'Coordinator diagnostic (not aggregate)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[coordinator-recovery]') && 'Coordinator recovery (affected tests)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[integration-repair]') && 'Integration repair (affected tests)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[publication-admission]') && 'Publication admission (affected tests)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-cleanup]') && 'Windows cleanup capability (not integration)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[worker-cleanup]') && 'Worker and completed cleanup (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[cancel-cleanup]') && 'Canceled staging (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[validator-retirement]') && 'Validator retirement (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[queue-lifecycle]') && 'Queue cancellation lifecycle (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[job-diagnostics]') && 'Typed job diagnostics (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[project-restore]') && 'Project backup restore (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[restore-ui]') && 'Project restore UI (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[media-observation]') && 'Typed media observation (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[frame-observation]') && 'Decoded frame observation (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[media-inspector-ui]') && 'Media inspector UI (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[tool-inventory-ui]') && 'Tool inventory UI (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[tool-pair-ui]') && 'Selected pair UI (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[tool-preferences]') && 'Explicit tool preferences (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[tool-first-open]') && 'First Settings background inventory (affected only)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[project-create]') && 'Blank project lifecycle (affected only)' || 'Foundation' }} (${{ matrix.os }}, ${{ matrix.python }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PROJECT_CREATE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[project-create]') }}
      TOOL_FIRST_OPEN: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tool-first-open]') }}
      TOOL_PREFERENCES: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tool-preferences]') }}
      COORDINATOR_DIAGNOSTIC: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[coordinator-diagnostic]') }}
      COORDINATOR_RECOVERY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[coordinator-recovery]') }}
      INTEGRATION_REPAIR: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[integration-repair]') }}
      WINDOWS_BOUNDARY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-boundary]') }}
      PUBLICATION_ADMISSION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publication-admission]') }}
      ADMISSION_OBSERVATION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[admission-observation]') }}
      TOOL_PAIR_UI: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tool-pair-ui]') }}
      TOOL_INVENTORY_UI: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tool-inventory-ui]') }}
      MEDIA_INSPECTOR_UI: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[media-inspector-ui]') }}
      FRAME_OBSERVATION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[frame-observation]') }}
      MEDIA_OBSERVATION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[media-observation]') }}
      RESTORE_UI: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[restore-ui]') }}
      PROJECT_RESTORE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[project-restore]') }}
      JOB_DIAGNOSTICS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[job-diagnostics]') }}
      QUEUE_LIFECYCLE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[queue-lifecycle]') }}
      VALIDATOR_RETIREMENT: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[validator-retirement]') }}
      CANCEL_CLEANUP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cancel-cleanup]') }}
      WORKER_CLEANUP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[worker-cleanup]') }}
      WINDOWS_CLEANUP: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-cleanup]') }}
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: ${{ matrix.python }}
      - name: Assert exact reviewed source checkout
        run: python scripts/ci_identity.py
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.4
      - name: Reproduce fresh locked environment
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries
        if: matrix.os == 'ubuntu-24.04' && env.COORDINATOR_RECOVERY != 'true' && env.WORKER_CLEANUP != 'true' && env.CANCEL_CLEANUP != 'true' && env.VALIDATOR_RETIREMENT != 'true' && env.PROJECT_RESTORE != 'true' && env.MEDIA_OBSERVATION != 'true' && env.FRAME_OBSERVATION != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libgl1
      - name: Source foundation and actual platform process tests
        if: env.COORDINATOR_DIAGNOSTIC != 'true' && env.COORDINATOR_RECOVERY != 'true' && env.INTEGRATION_REPAIR != 'true' && env.PUBLICATION_ADMISSION != 'true' && env.WINDOWS_CLEANUP != 'true' && env.WORKER_CLEANUP != 'true' && env.CANCEL_CLEANUP != 'true' && env.VALIDATOR_RETIREMENT != 'true' && env.QUEUE_LIFECYCLE != 'true' && env.JOB_DIAGNOSTICS != 'true' && env.PROJECT_RESTORE != 'true' && env.RESTORE_UI != 'true' && env.MEDIA_OBSERVATION != 'true' && env.FRAME_OBSERVATION != 'true' && env.MEDIA_INSPECTOR_UI != 'true' && env.TOOL_INVENTORY_UI != 'true' && env.TOOL_PAIR_UI != 'true' && env.TOOL_PREFERENCES != 'true' && env.TOOL_FIRST_OPEN != 'true' && env.PROJECT_CREATE != 'true'
        run: uv run --no-sync python -m pytest -q --junitxml=foundation-results.xml
      - name: Blank project creation and interrupted shared shell (affected only)
        if: env.PROJECT_CREATE == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_project_creation.py tests/test_project_creation_ui.py tests/test_shell.py tests/test_project_recovery_ui.py tests/test_root_relink.py tests/test_project_restore_ui.py tests/test_media_inspection_ui.py tests/test_tool_inventory_ui.py tests/test_tool_preferences_ui.py tests/test_tool_first_open.py --junitxml=foundation-results.xml
      - name: First Settings background inventory and interrupted shared UI (affected only)
        if: env.TOOL_FIRST_OPEN == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_tool_first_open.py tests/test_tool_inventory_ui.py tests/test_tool_preferences_ui.py tests/test_shell.py tests/test_project_recovery_ui.py tests/test_root_relink.py tests/test_project_restore_ui.py tests/test_media_inspection_ui.py --junitxml=foundation-results.xml
      - name: Durable explicit preferences and shared Settings retirement (affected only)
        if: env.TOOL_PREFERENCES == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_tool_preferences.py tests/test_tool_preferences_ui.py tests/test_tool_inventory_ui.py tests/test_shell.py tests/test_project_recovery_ui.py tests/test_root_relink.py tests/test_project_restore_ui.py tests/test_media_inspection_ui.py --junitxml=foundation-results.xml
      - name: Explicit selected pair and shared Settings retirement (affected only)
        if: env.TOOL_PAIR_UI == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_pair_retirement_ui.py tests/test_tool_checks.py tests/test_tool_inventory_ui.py tests/test_shell.py tests/test_project_recovery_ui.py tests/test_root_relink.py tests/test_project_restore_ui.py tests/test_media_inspection_ui.py --junitxml=foundation-results.xml
      - name: Metadata-only Settings inventory and shared UI retirement (affected only)
        if: env.TOOL_INVENTORY_UI == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_tool_inventory_ui.py tests/test_shell.py tests/test_project_recovery_ui.py tests/test_root_relink.py tests/test_project_restore_ui.py tests/test_media_inspection_ui.py --junitxml=foundation-results.xml
      - name: Explicit media inspector UI and owned observation retirement (affected only)
        if: env.MEDIA_INSPECTOR_UI == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_media_inspection_ui.py tests/test_frame_observations.py::test_frame_invocation_records_actual_retirement_or_unknown tests/test_shell.py tests/test_project_recovery_ui.py tests/test_root_relink.py tests/test_project_restore_ui.py --junitxml=foundation-results.xml
      - name: Decoded frame observations and shared headless CLI boundaries (affected only)
        if: env.FRAME_OBSERVATION == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_frame_observations.py tests/test_media_observations.py::test_cli_inspection_uses_explicit_probe_no_private_metadata tests/test_media_observations.py::test_cli_inspection_requires_explicit_mode_and_paths tests/test_media_observations.py::test_fresh_inspection_cli_imports_no_gui_or_storage tests/test_subtitle_cli.py tests/test_project_backup_restore.py::test_cli_real_backup_headless_fresh_process tests/test_project_backup_restore.py::test_cli_restore_options_refused_before_io tests/test_project_backup_restore.py::test_cli_restore_foreign_target_and_bad_timeout_are_sanitized tests/test_tool_discovery.py::test_headless_scan_reports_metadata_without_qt_or_data_init tests/test_tool_discovery.py::test_invalid_tool_options_refused_before_data_creation tests/test_media_discovery.py::test_cli_returns_real_candidates_without_userdata_or_validation_claim --junitxml=foundation-results.xml
      - name: Typed media observations and shared headless CLI boundaries (affected only)
        if: env.MEDIA_OBSERVATION == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_media_observations.py tests/test_subtitle_cli.py tests/test_project_backup_restore.py::test_cli_real_backup_headless_fresh_process tests/test_project_backup_restore.py::test_cli_restore_options_refused_before_io tests/test_project_backup_restore.py::test_cli_restore_foreign_target_and_bad_timeout_are_sanitized tests/test_tool_discovery.py::test_headless_scan_reports_metadata_without_qt_or_data_init tests/test_tool_discovery.py::test_invalid_tool_options_refused_before_data_creation tests/test_media_discovery.py::test_cli_returns_real_candidates_without_userdata_or_validation_claim --junitxml=foundation-results.xml
      - name: Project restore UI and shared shell retirement (affected only)
        if: env.RESTORE_UI == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_project_restore_ui.py tests/test_shell.py tests/test_project_recovery_ui.py tests/test_root_relink.py --junitxml=foundation-results.xml
      - name: Offline migration backup restore and shared CLI/store boundaries (affected only)
        if: env.PROJECT_RESTORE == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_project_backup_restore.py tests/test_projects.py tests/test_project_store_identity.py tests/test_subtitle_cli.py --junitxml=foundation-results.xml
      - name: Typed bounded diagnostics and command outcome separation (affected only)
        if: env.JOB_DIAGNOSTICS == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_job_events.py tests/test_job_events_ui.py tests/test_queue_commands.py tests/test_coordinator_inbox.py tests/test_queue_progress.py tests/test_queue_cancel_lifecycle.py --junitxml=foundation-results.xml
      - name: Queue UI cancellation through owned validator retirement (affected only)
        if: env.QUEUE_LIFECYCLE == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_queue_cancel_lifecycle.py tests/test_coordinator_inbox.py tests/test_queue_progress.py --junitxml=foundation-results.xml
      - name: Typed validator retirement and owned cancellation (affected only)
        if: env.VALIDATOR_RETIREMENT == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_retirement_lifecycle.py tests/test_canceled_cleanup.py::test_unknown_validator_retirement_stays_blocked_after_cancel_ack tests/test_process.py::test_output_and_exit_code tests/test_windows_process.py::test_real_output_unicode_argument_and_exit tests/test_media_validation.py::test_exact_mapping_and_owned_decode_flags tests/test_media_validation.py::test_failed_decode_changed_bytes_and_cancel_never_accept --junitxml=foundation-results.xml
      - name: Canceled owned staging and shared writer boundaries (affected only)
        if: env.CANCEL_CLEANUP == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_canceled_cleanup.py tests/test_stage_streaming.py::test_cancel_keeps_source_and_never_publishes tests/test_stage_streaming.py::test_cancel_after_writer_flush_retains_exact_receipt tests/test_completed_cleanup.py::test_cleanup_completed_exact_set_preserves_all_finals_history tests/test_publication_session.py::test_all_roles_prepare_then_atomic_claim_no_final_or_success tests/test_publication_session.py::test_caller_cannot_substitute_staged_validation tests/test_publication_session.py::test_cancel_before_prepare_has_no_journal_rows --junitxml=foundation-results.xml
      - name: Owned progress and completed publication cleanup (affected only)
        if: env.WORKER_CLEANUP == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_progress.py tests/test_completed_cleanup.py tests/test_publication_filesystem.py tests/test_stage_streaming.py tests/test_publication_session.py --junitxml=foundation-results.xml
      - name: Actual Windows object-bound deletion capability (not app cleanup acceptance)
        if: env.WINDOWS_CLEANUP == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_windows_cleanup.py --junitxml=foundation-results.xml
      - name: Affected live publication admission (not aggregate acceptance)
        if: env.PUBLICATION_ADMISSION == 'true' && env.ADMISSION_OBSERVATION != 'true'
        run: uv run --no-sync python -m pytest -q tests/test_publication_admission.py tests/test_publication_session.py tests/test_publication_recovery.py --junitxml=foundation-results.xml
      - name: Observable source mutation boundaries (not aggregate acceptance)
        if: env.PUBLICATION_ADMISSION == 'true' && env.ADMISSION_OBSERVATION == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_publication_admission.py -k 'precision or source_change_after_hash' --junitxml=foundation-results.xml
      - name: Affected integration repair (not aggregate acceptance)
        if: env.INTEGRATION_REPAIR == 'true' && env.WINDOWS_BOUNDARY != 'true'
        run: uv run --no-sync python -m pytest -q tests/test_jobs_migration.py tests/test_jobs_open_identity.py tests/test_media_discovery.py tests/test_tool_discovery.py tests/test_frozen_boundary_harness.py --junitxml=foundation-results.xml
      - name: Affected read-only discovery boundary (not aggregate acceptance)
        if: env.INTEGRATION_REPAIR == 'true' && env.WINDOWS_BOUNDARY == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_tool_discovery.py::test_fresh_process_scan_imports_no_gui_or_storage tests/test_frozen_boundary_harness.py --junitxml=foundation-results.xml
      - name: Targeted coordinator crash diagnostic (not aggregate acceptance)
        if: env.COORDINATOR_DIAGNOSTIC == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_coordinator_ownership.py -k 'owned_child_death or post_exit' --junitxml=foundation-results.xml
      - name: Affected coordinator recovery and journal boundaries (not aggregate acceptance)
        if: env.COORDINATOR_RECOVERY == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_coordinator_sqlite_recovery.py tests/test_coordinator_ownership.py tests/test_sqlite_open.py tests/test_db_ownership.py tests/test_jobs.py tests/test_jobs_migration.py tests/test_publication_session.py --junitxml=foundation-results.xml
      - name: Preserved plan integrity
        if: env.COORDINATOR_DIAGNOSTIC != 'true' && env.COORDINATOR_RECOVERY != 'true' && env.WINDOWS_CLEANUP != 'true' && env.WORKER_CLEANUP != 'true' && env.CANCEL_CLEANUP != 'true' && env.VALIDATOR_RETIREMENT != 'true' && env.QUEUE_LIFECYCLE != 'true' && env.JOB_DIAGNOSTICS != 'true' && env.PROJECT_RESTORE != 'true' && env.RESTORE_UI != 'true' && env.MEDIA_OBSERVATION != 'true' && env.FRAME_OBSERVATION != 'true' && env.MEDIA_INSPECTOR_UI != 'true' && env.TOOL_INVENTORY_UI != 'true' && env.TOOL_PAIR_UI != 'true' && env.TOOL_PREFERENCES != 'true' && env.TOOL_FIRST_OPEN != 'true' && env.PROJECT_CREATE != 'true'
        run: uv run --no-sync python scripts/check_plan.py
      - name: Structural schema fixtures
        if: env.COORDINATOR_DIAGNOSTIC != 'true' && env.COORDINATOR_RECOVERY != 'true' && env.WINDOWS_CLEANUP != 'true' && env.WORKER_CLEANUP != 'true' && env.CANCEL_CLEANUP != 'true' && env.VALIDATOR_RETIREMENT != 'true' && env.QUEUE_LIFECYCLE != 'true' && env.JOB_DIAGNOSTICS != 'true' && env.PROJECT_RESTORE != 'true' && env.RESTORE_UI != 'true' && env.MEDIA_OBSERVATION != 'true' && env.FRAME_OBSERVATION != 'true' && env.MEDIA_INSPECTOR_UI != 'true' && env.TOOL_INVENTORY_UI != 'true' && env.TOOL_PAIR_UI != 'true' && env.TOOL_PREFERENCES != 'true' && env.TOOL_FIRST_OPEN != 'true' && env.PROJECT_CREATE != 'true'
        run: uv run --no-sync python scripts/check_schema_design.py
      - name: Build actual Windows development onedir
        if: matrix.os == 'windows-latest' && matrix.python == '3.12' && env.COORDINATOR_RECOVERY != 'true' && env.COORDINATOR_DIAGNOSTIC != 'true' && env.PUBLICATION_ADMISSION != 'true' && env.WINDOWS_CLEANUP != 'true' && env.WORKER_CLEANUP != 'true' && env.CANCEL_CLEANUP != 'true' && env.VALIDATOR_RETIREMENT != 'true' && env.QUEUE_LIFECYCLE != 'true' && env.JOB_DIAGNOSTICS != 'true' && env.PROJECT_RESTORE != 'true' && env.RESTORE_UI != 'true' && env.MEDIA_OBSERVATION != 'true' && env.FRAME_OBSERVATION != 'true' && env.MEDIA_INSPECTOR_UI != 'true' && env.TOOL_INVENTORY_UI != 'true' && env.TOOL_PAIR_UI != 'true' && env.TOOL_PREFERENCES != 'true' && env.TOOL_FIRST_OPEN != 'true' && env.PROJECT_CREATE != 'true'
        run: uv run --no-sync pyinstaller --noconfirm --clean --name FonesiEdit --onedir --paths src --collect-data fonesi_edit src/fonesi_edit/__main__.py
      - name: Frozen schema/subtitle/tool-discovery/license boundaries (not GUI/media acceptance)
        if: matrix.os == 'windows-latest' && matrix.python == '3.12' && env.COORDINATOR_RECOVERY != 'true' && env.COORDINATOR_DIAGNOSTIC != 'true' && env.PUBLICATION_ADMISSION != 'true' && env.WINDOWS_CLEANUP != 'true' && env.WORKER_CLEANUP != 'true' && env.CANCEL_CLEANUP != 'true' && env.VALIDATOR_RETIREMENT != 'true' && env.QUEUE_LIFECYCLE != 'true' && env.JOB_DIAGNOSTICS != 'true' && env.PROJECT_RESTORE != 'true' && env.RESTORE_UI != 'true' && env.MEDIA_OBSERVATION != 'true' && env.FRAME_OBSERVATION != 'true' && env.MEDIA_INSPECTOR_UI != 'true' && env.TOOL_INVENTORY_UI != 'true' && env.TOOL_PAIR_UI != 'true' && env.TOOL_PREFERENCES != 'true' && env.TOOL_FIRST_OPEN != 'true' && env.PROJECT_CREATE != 'true'
        run: uv run --no-sync python scripts/check_frozen_boundaries.py --binary dist/FonesiEdit/FonesiEdit.exe --report frozen-cli-results.json
      - name: Save exact test/skipped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: ${{ env.COORDINATOR_DIAGNOSTIC == 'true' && 'coordinator-diagnostic' || env.COORDINATOR_RECOVERY == 'true' && 'coordinator-recovery' || env.INTEGRATION_REPAIR == 'true' && 'integration-repair' || env.PUBLICATION_ADMISSION == 'true' && 'publication-admission' || env.WINDOWS_CLEANUP == 'true' && 'windows-cleanup' || env.WORKER_CLEANUP == 'true' && 'worker-cleanup' || env.CANCEL_CLEANUP == 'true' && 'cancel-cleanup' || env.VALIDATOR_RETIREMENT == 'true' && 'validator-retirement' || env.QUEUE_LIFECYCLE == 'true' && 'queue-lifecycle' || env.JOB_DIAGNOSTICS == 'true' && 'job-diagnostics' || env.PROJECT_RESTORE == 'true' && 'project-restore' || env.RESTORE_UI == 'true' && 'restore-ui' || env.MEDIA_OBSERVATION == 'true' && 'media-observation' || env.FRAME_OBSERVATION == 'true' && 'frame-observation' || env.MEDIA_INSPECTOR_UI == 'true' && 'media-inspector-ui' || env.TOOL_INVENTORY_UI == 'true' && 'tool-inventory-ui' || env.TOOL_PAIR_UI == 'true' && 'tool-pair-ui' || env.TOOL_PREFERENCES == 'true' && 'tool-preferences' || env.TOOL_FIRST_OPEN == 'true' && 'tool-first-open' || env.PROJECT_CREATE == 'true' && 'project-create' || 'foundation' }}-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            foundation-results.xml
            foundation-source.json
            frozen-cli-results.json
          if-no-files-found: warn
