name: Clean foundation (not product acceptance)
on:
  push:
    branches: [phase-03]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      # Explicit diagnostic commits preserve prior green matrix evidence; not aggregate acceptance.
      matrix: ${{ fromJSON(github.event_name == 'push' && (contains(github.event.head_commit.message, '[coordinator-diagnostic]') || contains(github.event.head_commit.message, '[windows-boundary]') || contains(github.event.head_commit.message, '[admission-observation]')) && '{"include":[{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.13"}]}' || '{"os":["windows-latest","ubuntu-24.04"],"python":["3.12","3.13"]}') }}
    name: "${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[coordinator-diagnostic]') && 'Coordinator diagnostic (not aggregate)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[coordinator-recovery]') && 'Coordinator recovery (affected tests)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[integration-repair]') && 'Integration repair (affected tests)' || github.event_name == 'push' && contains(github.event.head_commit.message, '[publication-admission]') && 'Publication admission (affected tests)' || 'Foundation' }} (${{ matrix.os }}, ${{ matrix.python }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      COORDINATOR_DIAGNOSTIC: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[coordinator-diagnostic]') }}
      COORDINATOR_RECOVERY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[coordinator-recovery]') }}
      INTEGRATION_REPAIR: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[integration-repair]') }}
      WINDOWS_BOUNDARY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-boundary]') }}
      PUBLICATION_ADMISSION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publication-admission]') }}
      ADMISSION_OBSERVATION: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[admission-observation]') }}
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: ${{ matrix.python }}
      - name: Assert exact reviewed source checkout
        run: python scripts/ci_identity.py
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.4
      - name: Reproduce fresh locked environment
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries
        if: matrix.os == 'ubuntu-24.04' && env.COORDINATOR_RECOVERY != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libgl1
      - name: Source foundation and actual platform process tests
        if: env.COORDINATOR_DIAGNOSTIC != 'true' && env.COORDINATOR_RECOVERY != 'true' && env.INTEGRATION_REPAIR != 'true' && env.PUBLICATION_ADMISSION != 'true'
        run: uv run --no-sync python -m pytest -q --junitxml=foundation-results.xml
      - name: Affected live publication admission (not aggregate acceptance)
        if: env.PUBLICATION_ADMISSION == 'true' && env.ADMISSION_OBSERVATION != 'true'
        run: uv run --no-sync python -m pytest -q tests/test_publication_admission.py tests/test_publication_session.py tests/test_publication_recovery.py --junitxml=foundation-results.xml
      - name: Observable source mutation boundaries (not aggregate acceptance)
        if: env.PUBLICATION_ADMISSION == 'true' && env.ADMISSION_OBSERVATION == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_publication_admission.py -k 'precision or source_change_after_hash' --junitxml=foundation-results.xml
      - name: Affected integration repair (not aggregate acceptance)
        if: env.INTEGRATION_REPAIR == 'true' && env.WINDOWS_BOUNDARY != 'true'
        run: uv run --no-sync python -m pytest -q tests/test_jobs_migration.py tests/test_jobs_open_identity.py tests/test_media_discovery.py tests/test_tool_discovery.py tests/test_frozen_boundary_harness.py --junitxml=foundation-results.xml
      - name: Affected read-only discovery boundary (not aggregate acceptance)
        if: env.INTEGRATION_REPAIR == 'true' && env.WINDOWS_BOUNDARY == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_tool_discovery.py::test_fresh_process_scan_imports_no_gui_or_storage tests/test_frozen_boundary_harness.py --junitxml=foundation-results.xml
      - name: Targeted coordinator crash diagnostic (not aggregate acceptance)
        if: env.COORDINATOR_DIAGNOSTIC == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_coordinator_ownership.py -k 'owned_child_death or post_exit' --junitxml=foundation-results.xml
      - name: Affected coordinator recovery and journal boundaries (not aggregate acceptance)
        if: env.COORDINATOR_RECOVERY == 'true'
        run: uv run --no-sync python -m pytest -q tests/test_coordinator_sqlite_recovery.py tests/test_coordinator_ownership.py tests/test_sqlite_open.py tests/test_db_ownership.py tests/test_jobs.py tests/test_jobs_migration.py tests/test_publication_session.py --junitxml=foundation-results.xml
      - name: Preserved plan integrity
        if: env.COORDINATOR_DIAGNOSTIC != 'true' && env.COORDINATOR_RECOVERY != 'true'
        run: uv run --no-sync python scripts/check_plan.py
      - name: Structural schema fixtures
        if: env.COORDINATOR_DIAGNOSTIC != 'true' && env.COORDINATOR_RECOVERY != 'true'
        run: uv run --no-sync python scripts/check_schema_design.py
      - name: Build actual Windows development onedir
        if: matrix.os == 'windows-latest' && matrix.python == '3.12' && env.COORDINATOR_RECOVERY != 'true' && env.COORDINATOR_DIAGNOSTIC != 'true' && env.PUBLICATION_ADMISSION != 'true'
        run: uv run --no-sync pyinstaller --noconfirm --clean --name FonesiEdit --onedir --paths src --collect-data fonesi_edit src/fonesi_edit/__main__.py
      - name: Frozen schema/subtitle/tool-discovery/license boundaries (not GUI/media acceptance)
        if: matrix.os == 'windows-latest' && matrix.python == '3.12' && env.COORDINATOR_RECOVERY != 'true' && env.COORDINATOR_DIAGNOSTIC != 'true' && env.PUBLICATION_ADMISSION != 'true'
        run: uv run --no-sync python scripts/check_frozen_boundaries.py --binary dist/FonesiEdit/FonesiEdit.exe --report frozen-cli-results.json
      - name: Save exact test/skipped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: ${{ env.COORDINATOR_DIAGNOSTIC == 'true' && 'coordinator-diagnostic' || env.COORDINATOR_RECOVERY == 'true' && 'coordinator-recovery' || env.INTEGRATION_REPAIR == 'true' && 'integration-repair' || env.PUBLICATION_ADMISSION == 'true' && 'publication-admission' || 'foundation' }}-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            foundation-results.xml
            foundation-source.json
            frozen-cli-results.json
          if-no-files-found: warn
