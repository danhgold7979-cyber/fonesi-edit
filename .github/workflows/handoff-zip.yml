name: Build complete handoff ZIP
on:
  push:
    branches: [develop/fonesi-full]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all branches and tags
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local --unset-all credential.helper || true
      - name: Build complete ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_handoff_zip.py --output "$RUNNER_TEMP/Tai-Zip.zip"
          unzip -t "$RUNNER_TEMP/Tai-Zip.zip"
      - name: Upload handoff artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fonesi-edit-handoff
          path: |
            ${{ runner.temp }}/Tai-Zip.zip
            ${{ runner.temp }}/Tai-Zip.zip.sha256.txt
          if-no-files-found: error
          retention-days: 14
