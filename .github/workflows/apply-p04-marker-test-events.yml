name: Apply P04 marker viewport router

on:
  push:
    branches: [develop/fonesi-full]
    paths:
      - '.github/scripts/apply_p04_marker_fix.py'
      - '.github/workflows/apply-p04-marker-test-events.yml'

permissions:
  contents: write

concurrency:
  group: apply-p04-marker-viewport-router
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'danhgold7979-cyber'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact integration HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reproduce locked environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.13.4
          uv sync --locked --python 3.12
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libgl1

      - name: Apply guarded fix and run exact regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/scripts/apply_p04_marker_fix.py)" = "b99818fc76902f67d486502f3506bafcbb4fd1cd"
          uv run --no-sync python .github/scripts/apply_p04_marker_fix.py
          git diff --check
          uv run --no-sync python -m compileall -q src tests scripts .github/scripts
          uv run --no-sync python -m pytest -q \
            tests/test_timeline_panel_controls.py::test_timeline_marker_viewport_drag_commits_once_and_shared_undo_redo \
            tests/test_timeline_panel_controls.py::test_timeline_marker_drag_collision_and_escape_do_not_create_commands

      - name: Commit reviewed fix and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/apply_p04_marker_fix.py \
            .github/patches/p04-marker-test-events.patch \
            .github/workflows/apply-p04-marker-test-events.yml
          git add src/fonesi_edit/ui/timeline.py tests/test_timeline_panel_controls.py
          git config user.name 'danhgold7979-cyber'
          git config user.email 'danhgold7979@gmail.com'
          git commit -m 'fix(P04-05): commit marker drag through viewport'
          git push origin HEAD:develop/fonesi-full
