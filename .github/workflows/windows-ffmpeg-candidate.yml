name: Pinned Windows FFmpeg synthetic capability (not product acceptance)
on:
  push:
    branches: [phase-03]
permissions:
  contents: read
jobs:
  candidate:
    if: contains(github.event.head_commit.message, '[windows-ffmpeg]') || contains(github.event.head_commit.message, '[windows-pair-ui]')
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Record exact source and runtime
        run: python scripts/ci_identity.py
      - name: Install pinned environment manager
        run: python -m pip install uv==0.13.4
      - name: Reproduce locked app environment
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Test harness refusal boundaries (no candidate launch)
        if: ${{ !contains(github.event.head_commit.message, '[native-fixture-repair]') && !contains(github.event.head_commit.message, '[windows-pair-ui]') }}
        run: uv run --no-sync python -m pytest -q tests/test_windows_ffmpeg_harness.py --junitxml=candidate-harness-results.xml
      - name: Fetch only exact reviewed candidate into new runner file
        shell: python
        run: |
          import hashlib,json,pathlib,urllib.request
          pin=json.loads(pathlib.Path('scripts/windows_ffmpeg_candidate.json').read_text())
          h=hashlib.sha256(); total=0
          with urllib.request.urlopen(pin['url'],timeout=60) as response, open('candidate.zip','xb') as output:
              if not response.url.startswith('https://'): raise RuntimeError('HTTPS redirect required')
              while chunk:=response.read(min(1024*1024,pin['size']-total+1)):
                  total+=len(chunk)
                  if total>pin['size']: raise RuntimeError('Candidate download exceeds exact size')
                  h.update(chunk);output.write(chunk)
          if total!=pin['size'] or h.hexdigest()!=pin['sha256']: raise RuntimeError('Candidate hash/size mismatch; no substitution')
      - name: Explicit actual pinned FFmpeg synthetic CPU gate
        if: ${{ !contains(github.event.head_commit.message, '[windows-pair-ui]') }}
        shell: pwsh
        run: |
          uv run --no-sync python scripts/check_windows_ffmpeg.py --archive "$pwd/candidate.zip" --work-dir "$pwd/owned-candidate-work" --report "$pwd/windows-ffmpeg-results.json" --execute-reviewed-candidate
      - name: Actual explicit selected pair through Qt (not activation)
        if: contains(github.event.head_commit.message, '[windows-pair-ui]')
        shell: pwsh
        run: |
          uv run --no-sync python scripts/check_windows_pair_ui.py --archive "$pwd/candidate.zip" --work-dir "$pwd/owned-pair-ui-Công cụ" --report "$pwd/windows-pair-ui-results.json" --execute-reviewed-candidate
      - name: Save metadata only (never binaries or generated media)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ contains(github.event.head_commit.message, '[windows-pair-ui]') && 'windows-pair-ui' || 'windows-ffmpeg' }}-py${{ matrix.python }}
          path: |
            foundation-source.json
            candidate-harness-results.xml
            windows-ffmpeg-results.json
            windows-pair-ui-results.json
          if-no-files-found: error
