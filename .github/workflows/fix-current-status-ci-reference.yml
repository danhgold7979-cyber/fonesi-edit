name: Fix current CI reference

on:
  push:
    branches: [develop/fonesi-full]
    paths:
      - '.github/scripts/fix_current_status_ci_reference.py'
      - '.github/workflows/fix-current-status-ci-reference.yml'

permissions:
  contents: write

concurrency:
  group: fix-current-status-ci-reference
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor == 'danhgold7979-cyber'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact integration HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply guarded documentation repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/scripts/fix_current_status_ci_reference.py)" = "0b1c4a7f560d147d85b3bbe0025a0a58f3bf4332"
          python .github/scripts/fix_current_status_ci_reference.py
          git diff --check
          python scripts/check_plan.py

      - name: Commit repair and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/fix_current_status_ci_reference.py \
            .github/workflows/fix-current-status-ci-reference.yml
          git add docs/CURRENT_STATUS.md
          git config user.name 'danhgold7979-cyber'
          git config user.email 'danhgold7979@gmail.com'
          git commit -m 'docs(P04-05): preserve current evidence integrity'
          git push origin HEAD:develop/fonesi-full
