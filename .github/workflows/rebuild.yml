name: Clean rebuild checks
on:
  push:
    branches: ['rebuild/**']
  workflow_dispatch:
jobs:
  linux-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0
      - run: uv sync --locked
      - run: uv run python scripts/check_plan.py
      - run: uv run python -m compileall -q src
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run fonesi-edit --diagnose
  windows-packaged:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked
      - name: Install pinned verified FFmpeg x64
        run: uv run python scripts/bootstrap_windows_tools.py
      - run: uv run python scripts/check_plan.py
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build actual Windows desktop
        run: uv run python scripts/build_desktop.py
      - name: Exercise frozen workers, render, yt-dlp and gallery-dl
        run: uv run python scripts/verify_packaged.py --output .local/windows-packaged-proof
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-clean-rebuild-evidence
          path: |
            .local/windows-packaged-proof/proof.json
            dist/FonesiEdit/build-manifest.json
          if-no-files-found: warn
