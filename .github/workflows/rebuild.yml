name: Rebuild foundation verification
on:
  push:
    branches: [rebuild]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked Qt toolchain
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked
      - name: Install Linux media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libegl1 libopengl0
      - name: Install Windows media tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --version=7.1.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Verify real media prerequisites
        run: |
          python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
          ffmpeg -version
          ffprobe -version
      - name: Static checks and formatting
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Compile new source
        run: uv run python -m compileall -q src tests
      - name: Test independent foundation only
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: uv run python -m unittest discover -s tests -v
      - name: Check rebuild plan contracts
        run: uv run python scripts/check_rebuild_plan.py
