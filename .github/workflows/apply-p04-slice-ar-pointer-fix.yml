name: Apply P04 Slice AR pointer fix

on:
  push:
    branches: [develop/fonesi-full]
    paths:
      - '.github/patches/p04-slice-ar-pointer-fix.patch'
      - '.github/workflows/apply-p04-slice-ar-pointer-fix.yml'

permissions:
  contents: write

concurrency:
  group: apply-p04-slice-ar-pointer-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'danhgold7979-cyber'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact integration HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate and apply reviewed fix
        shell: bash
        run: |
          set -euo pipefail
          echo "c3d21f641a54fdc4afa703471f2122a5684f99432972499cbdfcdbcb4c1b38c6  .github/patches/p04-slice-ar-pointer-fix.patch" | sha256sum --check --strict -
          git apply --check .github/patches/p04-slice-ar-pointer-fix.patch
          git apply .github/patches/p04-slice-ar-pointer-fix.patch
          git diff --check
          python -m compileall -q src tests scripts

      - name: Commit reviewed fix and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/patches/p04-slice-ar-pointer-fix.patch .github/workflows/apply-p04-slice-ar-pointer-fix.yml
          git add src/fonesi_edit/ui/timeline.py
          git config user.name 'danhgold7979-cyber'
          git config user.email 'danhgold7979@gmail.com'
          git commit -m 'fix(P04-05): allow marker drag beneath playhead'
          git push origin HEAD:develop/fonesi-full
